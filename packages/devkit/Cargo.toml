[package]
name = "stellar-devkit"
version = "0.1.0"
edition = "2021"
description = "Developer toolkit for testing and simulating the Stellar fee tracker"

[dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
rand = { version = "0.8", features = ["small_rng"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# rusqlite 0.30 uses libsqlite3-sys ^0.27 — the same major version required by
# sqlx 0.7 (packages/core), satisfying Cargo's single-links-value constraint.
# The "bundled" feature compiles sqlite3 from source, making the benchmark
# hermetic and reproducible in CI without a system sqlite3 installation.
rusqlite = { version = "0.30", features = ["bundled"] }
tempfile = "3"
tokio-test = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

[[bench]]
name = "fee_model_bench"
harness = false

[[bench]]
name = "rolling_window_bench"
harness = false

[[bench]]
name = "percentile_bench"
harness = false

[[bench]]
name = "main"
harness = false

[[bench]]
name = "spike_bench"
harness = false

[[bench]]
name = "congestion_bench"
harness = false

[[bench]]
name = "fee_polling_bench"
harness = false

[[bench]]
name = "analytics_bench"
harness = false

[[bench]]
name = "protocol_bench"
harness = false

[[bench]]
name = "storage_bench"
harness = false
